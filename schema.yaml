        organizer_username:
          type: string
          readOnly: true
        tracks_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - description
      - end_date
      - id
      - name
      - organizer_username
      - slug
      - start_date
      - submission_deadline
      - tracks_count
      - voting_end
      - voting_start
    EventRole:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        user:
          type: integer
        username:
          type: string
          readOnly: true
        email:
          type: string
          readOnly: true
        role:
          $ref: '#/components/schemas/EventRoleChoiceEnum'
        assigned_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - assigned_at
      - email
      - id
      - role
      - user
      - username
    EventRoleChoiceEnum:
      enum:
      - organizer
      - judge
      - participant
      type: string
      description: |-
        * `organizer` - Organizer
        * `judge` - Judge
        * `participant` - Participant
    EventRoleCreate:
      type: object
      properties:
        user_id:
          type: integer
          description: ID of User to assign role to
        role:
          allOf:
          - $ref: '#/components/schemas/EventRoleChoiceEnum'
          description: |-
            Role: organizer, judge, participant

            * `organizer` - Organizer
            * `judge` - Judge
            * `participant` - Participant
      required:
      - role
      - user_id
    FieldTypeEnum:
      enum:
      - text
      - textarea
      - url
      - select
      - checkbox
      type: string
      description: |-
        * `text` - Single-line Text
        * `textarea` - Multi-line Text (Textarea)
        * `url` - URL
        * `select` - Select Dropdown
        * `checkbox` - Checkbox (Boolean)
    Invite:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        token:
          type: string
          description: Cryptographically secure URL-safe invite token
          maxLength: 64
        email:
          nullable: true
          description: Optional target email address for email-gated invites
          oneOf:
          - type: string
            format: email
            maxLength: 255
          - type: string
            maxLength: 0
        expires_at:
          type: string
          format: date-time
          description: Timestamp when the invite becomes invalid
        used_at:
          type: string
          format: date-time
          nullable: true
          description: Timestamp when this invite was accepted and used
        is_expired:
          type: boolean
          readOnly: true
