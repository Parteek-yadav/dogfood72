openapi: 3.0.3
info:
  title: Dogfood 2026 Hackathon API
  version: 1.0.0
  description: Dogfood 2026 hackathon submission-and-judging platform API.
paths:
  /api/assignments/{assignment_id}/score/:
    post:
      operationId: api_assignments_score_create
      description: |-
        POST /api/assignments/{assignment_id}/score/
        Judge evaluates assigned submission on 1-5 scale for each criterion.
        Enforces judging window and assignment ownership.
      summary: Submit or save scores for an assigned submission
      parameters:
      - in: path
        name: assignment_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScoreSubmissionRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ScoreSubmissionRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ScoreSubmissionRequest'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreSubmissionResponse'
          description: ''
  /api/events/:
    get:
      operationId: api_events_list
      description: |-
        GET /api/events/
        Lists published events (and draft events if the user is an organizer).

        POST /api/events/
        Creates a new hackathon event. Automatically assigns organizer role to current user.
      summary: List hackathon events
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventList'
          description: ''
    post:
      operationId: api_events_create
      description: |-
        GET /api/events/
        Lists published events (and draft events if the user is an organizer).

        POST /api/events/
        Creates a new hackathon event. Automatically assigns organizer role to current user.
      summary: Create a new hackathon event
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventCreateUpdate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
  /api/events/{event_id}/assignments/override/:
    post:
      operationId: api_events_assignments_override_create
      description: |-
        POST /api/events/{event_id}/assignments/override/
        Manually add or remove a judge assignment with COI validation.
      summary: Manual judge assignment override
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManualAssignment'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ManualAssignment'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ManualAssignment'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: Assignment updated
  /api/events/{event_id}/assignments/run/:
    post:
      operationId: api_events_assignments_run_create
      description: |-
        POST /api/events/{event_id}/assignments/run/
        Executes balanced, conflict-of-interest-free algorithmic judge assignments.
      summary: Run algorithmic judge assignments with COI prevention
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlgorithmicAssignmentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AlgorithmicAssignmentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AlgorithmicAssignmentRequest'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlgorithmicAssignmentResponse'
          description: ''
  /api/events/{event_id}/export/assignments/:
    get:
      operationId: api_events_export_assignments_retrieve
      description: |-
        GET /api/events/{event_id}/export/assignments/
        Export judge assignments CSV (organizers only).
      summary: Export judge assignments as CSV
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: CSV export of judge assignments
  /api/events/{event_id}/export/normalized/:
    get:
      operationId: api_events_export_normalized_retrieve
      description: |-
        GET /api/events/{event_id}/export/normalized/
        Export normalized rankings CSV (organizers only).
      summary: Export normalized rankings as CSV
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          description: CSV export of normalized rankings
  /api/events/{event_id}/judge-progress/:
    get:
      operationId: api_events_judge_progress_retrieve
      description: |-
        GET /api/events/{id}/judge-progress/

        STRICT ISOLATION REQUIREMENT:
        - Must return 403 Forbidden for non-organizers.
        - Returns aggregate evaluation progress for organizers/admins.
      summary: Aggregate evaluation progress across judges (organizers only)
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JudgeProgressSummary'
          description: ''
  /api/events/{event_id}/my-assignments/:
    get:
      operationId: api_events_my_assignments_list
      description: |-
        GET /api/events/{id}/my-assignments/
        Allows an authenticated judge to retrieve only their own assignments and scores.
      summary: List assignments for authenticated judge
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MyAssignment'
          description: ''
  /api/events/{event_id}/normalize/:
    post:
      operationId: api_events_normalize_create
      description: |-
        POST /api/events/{event_id}/normalize/
        Triggers z-score normalization across all judges for an event.
      summary: Trigger z-score normalization for an event
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NormalizationTrigger'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/NormalizationTrigger'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/NormalizationTrigger'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NormalizationResponse'
          description: ''
  /api/events/{event_id}/prizes/:
    get:
      operationId: api_events_prizes_list
      description: |-
        GET, POST /api/events/{event_id}/prizes/
        List prizes or add a prize to an event (organizer required for POST).
      summary: List event prizes
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prize'
          description: ''
    post:
      operationId: api_events_prizes_create
      description: |-
        GET, POST /api/events/{event_id}/prizes/
        List prizes or add a prize to an event (organizer required for POST).
      summary: Create an event prize
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Prize'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Prize'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Prize'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Prize'
          description: ''
  /api/events/{event_id}/prizes/{id}/:
    delete:
      operationId: api_events_prizes_destroy
      description: |-
        DELETE /api/events/{event_id}/prizes/{pk}/
        Delete a prize from an event (organizer required).
      summary: Delete a prize
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/events/{event_id}/questions/:
    get:
      operationId: api_events_questions_list
      description: |-
        GET, POST /api/events/{event_id}/questions/
        List or add organizer-defined custom questions for submission forms.
      summary: List custom questions for an event
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CustomQuestion'
          description: ''
    post:
      operationId: api_events_questions_create
      description: |-
        GET, POST /api/events/{event_id}/questions/
        List or add organizer-defined custom questions for submission forms.
      summary: Add custom question to event submission form
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomQuestion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomQuestion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomQuestion'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CustomQuestion'
          description: ''
  /api/events/{event_id}/questions/{id}/:
    delete:
      operationId: api_events_questions_destroy
      description: |-
        DELETE /api/events/{event_id}/questions/{pk}/
        Delete a custom question from an event.
      summary: Delete custom question
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/events/{event_id}/roles/:
    get:
      operationId: api_events_roles_list
      description: |-
        GET, POST /api/events/{event_id}/roles/
        List roles or assign a role (organizer, judge, participant) to a user in this event.
      summary: List roles assigned in this event
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventRole'
          description: ''
    post:
      operationId: api_events_roles_create
      description: |-
        GET, POST /api/events/{event_id}/roles/
        List roles or assign a role (organizer, judge, participant) to a user in this event.
      summary: Assign a role to a user for this event
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRoleCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventRoleCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventRoleCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventRole'
          description: ''
  /api/events/{event_id}/rubric/:
    get:
      operationId: api_events_rubric_retrieve
      description: |-
        GET /api/events/{event_id}/rubric/
        Retrieve rubric and its criteria for an event.

        POST /api/events/{event_id}/rubric/
        Create or update rubric metadata for an event.
      summary: Retrieve rubric and criteria for an event
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubric'
          description: ''
    post:
      operationId: api_events_rubric_create
      description: |-
        GET /api/events/{event_id}/rubric/
        Retrieve rubric and its criteria for an event.

        POST /api/events/{event_id}/rubric/
        Create or update rubric metadata for an event.
      summary: Create or update event rubric
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RubricCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RubricCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RubricCreateUpdate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rubric'
          description: ''
  /api/events/{event_id}/rubric/criteria/:
    post:
      operationId: api_events_rubric_criteria_create
      description: |-
        POST /api/events/{event_id}/rubric/criteria/
        Add a new criterion to the event's rubric.
      summary: Add criterion to event rubric
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RubricCriterion'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RubricCriterion'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RubricCriterion'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RubricCriterion'
          description: ''
  /api/events/{event_id}/rubric/criteria/{id}/:
    delete:
      operationId: api_events_rubric_criteria_destroy
      description: |-
        DELETE /api/events/{event_id}/rubric/criteria/{pk}/
        Delete a criterion from the event's rubric.
      summary: Delete a criterion from event rubric
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/events/{event_id}/submissions/:
    get:
      operationId: api_events_submissions_list
      description: |-
        GET /api/events/{event_id}/submissions/
        Public gallery listing submitted projects for an event.
        Supports filtering by search query (?q=) and challenge track (?track=).
      summary: List submitted projects for an event
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      - in: query
        name: q
        schema:
          type: string
        description: Search text for title, tagline, or tech tags
      - in: query
        name: track
        schema:
          type: integer
        description: Filter by track ID
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Submission'
          description: ''
  /api/events/{event_id}/teams/:
    get:
      operationId: api_events_teams_list
      description: |-
        GET /api/events/{event_id}/teams/
        List teams formed in this event.

        POST /api/events/{event_id}/teams/
        Form a new team for this event. Enforces single-team-per-event constraint.
      summary: List teams for an event
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TeamDetail'
          description: ''
    post:
      operationId: api_events_teams_create
      description: |-
        GET /api/events/{event_id}/teams/
        List teams formed in this event.

        POST /api/events/{event_id}/teams/
        Form a new team for this event. Enforces single-team-per-event constraint.
      summary: Create a new team for an event
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/TeamCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/TeamCreate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamDetail'
          description: ''
  /api/events/{event_id}/tracks/:
    get:
      operationId: api_events_tracks_list
      description: |-
        GET, POST /api/events/{event_id}/tracks/
        List tracks or add a track to an event (organizer required for POST).
      summary: List event tracks
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
          description: ''
    post:
      operationId: api_events_tracks_create
      description: |-
        GET, POST /api/events/{event_id}/tracks/
        List tracks or add a track to an event (organizer required for POST).
      summary: Create an event track
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Track'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Track'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Track'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
          description: ''
  /api/events/{event_id}/tracks/{id}/:
    delete:
      operationId: api_events_tracks_destroy
      description: |-
        DELETE /api/events/{event_id}/tracks/{pk}/
        Delete a track from an event (organizer required).
      summary: Delete a track
      parameters:
      - in: path
        name: event_id
        schema:
          type: integer
        required: true
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '204':
          description: No response body
  /api/events/{id}/:
    get:
      operationId: api_events_retrieve
      description: |-
        GET /api/events/{id}/
        Retrieve event detail with tracks, prizes, and custom questions.

        PUT/PATCH /api/events/{id}/
        Update event schedule and details. Organizer permission required.

        DELETE /api/events/{id}/
        Delete event. Organizer permission required.
      summary: Retrieve event details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      security:
      - cookieAuth: []
      - basicAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
    put:
      operationId: api_events_update
      description: |-
        GET /api/events/{id}/
        Retrieve event detail with tracks, prizes, and custom questions.

        PUT/PATCH /api/events/{id}/
        Update event schedule and details. Organizer permission required.

        DELETE /api/events/{id}/
        Delete event. Organizer permission required.
      summary: Update event details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/EventCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/EventCreateUpdate'
        required: true
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EventDetail'
          description: ''
    patch:
      operationId: api_events_partial_update
      description: |-
        GET /api/events/{id}/
        Retrieve event detail with tracks, prizes, and custom questions.

        PUT/PATCH /api/events/{id}/
        Update event schedule and details. Organizer permission required.

        DELETE /api/events/{id}/
        Delete event. Organizer permission required.
      summary: Partially update event details
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        required: true
      tags:
      - api
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedEventCreateUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedEventCreateUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedEventCreateUpdate'
      security:
      - cookieAuth: []
      - basicAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
