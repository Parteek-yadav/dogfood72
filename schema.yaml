components:
  schemas:
    AlgorithmicAssignmentRequest:
      type: object
      properties:
        k:
          type: integer
          maximum: 20
          minimum: 1
          default: 3
          description: Number of judges per submission
    AlgorithmicAssignmentResponse:
      type: object
      properties:
        status:
          type: string
        assignments_generated:
          type: integer
        k:
          type: integer
      required:
      - assignments_generated
      - k
      - status
    Comment:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        submission:
          type: integer
        user:
          type: integer
        username:
          type: string
          readOnly: true
        body:
          type: string
          description: Comment text
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - body
      - created_at
      - id
      - submission
      - updated_at
      - user
      - username
    CommentCreate:
      type: object
      properties:
        body:
          type: string
          description: Comment text
      required:
      - body
    CustomQuestion:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        label:
          type: string
          description: The prompt or label displayed to the participant
          maxLength: 255
        field_type:
          allOf:
          - $ref: '#/components/schemas/FieldTypeEnum'
          description: |-
            Input control type

            * `text` - Single-line Text
            * `textarea` - Multi-line Text (Textarea)
            * `url` - URL
            * `select` - Select Dropdown
            * `checkbox` - Checkbox (Boolean)
        required:
          type: boolean
          description: Whether this question must be answered upon final submission
        order:
          type: integer
          maximum: 2147483647
          minimum: 0
          description: Display order sequence within the submission form
        choices:
          description: List of choices for 'select' field type, e.g. ["Option A",
            "Option B"]
      required:
      - id
      - label
    EventCreateUpdate:
      type: object
      properties:
        name:
          type: string
          description: Event title
          maxLength: 255
        slug:
          type: string
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          description: Full markdown/text description of the event
        start_date:
          type: string
          format: date-time
          description: Event start timestamp
        end_date:
          type: string
          format: date-time
          description: Event conclusion timestamp
        submission_deadline:
          type: string
          format: date-time
          description: Deadline for submission submissions and edits
        voting_start:
          type: string
          format: date-time
          description: Start of community/judge voting period
        voting_end:
          type: string
          format: date-time
          description: End of community/judge voting period
        is_published:
          type: boolean
          description: Whether event is visible to public
      required:
      - description
      - end_date
      - name
      - start_date
      - submission_deadline
      - voting_end
      - voting_start
    EventDetail:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Event title
          maxLength: 255
        slug:
          type: string
          description: Unique URL slug
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          description: Full markdown/text description of the event
        start_date:
          type: string
          format: date-time
          description: Event start timestamp
        end_date:
          type: string
          format: date-time
          description: Event conclusion timestamp
        submission_deadline:
          type: string
          format: date-time
          description: Deadline for submission submissions and edits
        voting_start:
          type: string
          format: date-time
          description: Start of community/judge voting period
        voting_end:
          type: string
          format: date-time
          description: End of community/judge voting period
        is_published:
          type: boolean
          description: Whether event is visible to public
        organizer:
          type: integer
          description: Primary event creator / lead organizer
        organizer_username:
          type: string
          readOnly: true
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
          readOnly: true
        prizes:
          type: array
          items:
            $ref: '#/components/schemas/Prize'
          readOnly: true
        custom_questions:
          type: array
          items:
            $ref: '#/components/schemas/CustomQuestion'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - custom_questions
      - description
      - end_date
      - id
      - name
      - organizer
      - organizer_username
      - prizes
      - slug
      - start_date
      - submission_deadline
      - tracks
      - updated_at
      - voting_end
      - voting_start
    EventList:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          description: Event title
          maxLength: 255
        slug:
          type: string
          description: Unique URL slug
          maxLength: 255
          pattern: ^[-a-zA-Z0-9_]+$
        description:
          type: string
          description: Full markdown/text description of the event
        start_date:
          type: string
          format: date-time
          description: Event start timestamp
        end_date:
          type: string
          format: date-time
          description: Event conclusion timestamp
        submission_deadline:
          type: string
          format: date-time
          description: Deadline for submission submissions and edits
        voting_start:
          type: string
          format: date-time
          description: Start of community/judge voting period
        voting_end:
          type: string
          format: date-time
          description: End of community/judge voting period
        is_published:
